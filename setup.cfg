[metadata]
name = django-graph-search
version = 0.2.0
description = Vector search for Django models with graph relations, optional LangGraph pipeline, conversational search, smart indexing and streaming.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = svalench
author_email = valenchits@icloud.com
url = https://github.com/svalench/django_graph_search
project_urls =
    Source = https://github.com/svalench/django_graph_search
    Issues = https://github.com/svalench/django_graph_search/issues
    Changelog = https://github.com/svalench/django_graph_search/blob/main/CHANGELOG.md
keywords = django, search, vector-search, semantic-search, embeddings, langgraph, llm, chromadb, faiss, qdrant
classifiers =
    Development Status :: 4 - Beta
    Framework :: Django
    Framework :: Django :: 4
    Framework :: Django :: 4.2
    Framework :: Django :: 5.0
    Framework :: Django :: 5.1
    Intended Audience :: Developers
    Topic :: Internet :: WWW/HTTP
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Text Processing :: Indexing
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
include_package_data = True
python_requires = >=3.10
install_requires =
    django>=4.2
    sentence-transformers>=2.2.2

[options.packages.find]
where = src

[options.extras_require]
chromadb =
    chromadb>=0.5.0
faiss =
    faiss-cpu>=1.7.4
qdrant =
    qdrant-client>=1.6.0
test =
    pytest>=9.0.0
    pytest-django>=4.0
langgraph =
    langgraph>=0.2.0
all =
    chromadb>=0.5.0
    faiss-cpu>=1.7.4
    qdrant-client>=1.6.0
    langgraph>=0.2.0

