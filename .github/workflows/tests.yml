name: Tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.1"]
        exclude:
          # Django 4.2 / 5.0 не поддерживают Python 3.13
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.13"
            django-version: "5.0"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Core tests use mocks; do not download PyTorch or embedding models.
        # Keep these test requirements aligned with setup.cfg's test extra.
        python -m pip install "django~=${{ matrix.django-version }}.0" "pytest>=9.0.0" "pytest-django>=4.0" "numpy>=1.26"
        python -m pip install --no-deps -e .
    - name: Run tests
      run: |
        python -m pytest tests/ -q -ra

  local-backends:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install the package with local backends and test dependencies
      run: |
        python -m pip install --upgrade pip
        # Preserve a normal dependency-resolution gate, including base ML dependencies.
        python -m pip install "django~=5.1.0" ".[test,chromadb,faiss]"
        python -m pip check
    - name: Verify optional backends are importable
      run: python -c "import chromadb; import faiss"
    - name: Run tests with local backends
      run: python -m pytest tests/ -q -ra

  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build package and validate metadata
      run: |
        python -m build
        python -m twine check --strict dist/*
    - name: Smoke test the installed wheel without optional ML dependencies
      run: |
        python -m pip install "django>=4.2"
        python -m pip install --no-deps dist/*.whl
        # Isolated mode prevents imports from resolving to the checkout.
        python -I tests/test_distribution.py
